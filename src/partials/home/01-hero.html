<section class="section s-hero" id="hero">

  <!-- ПЕРВЫЙ ЭКРАН

       Слева текст, справа фигура. Взято с варианта C, но без двух вещей,
       которые там были:

       · осыпи. В варианте C фигура была вырезом в песчаном поле и правым
         краем рассыпалась. От эффекта отказались — фигура и так хорошо
         сидит в фоне, а осыпь отвлекала от лица. Снимок теперь обычный:
         цветной кадр и маска, сведённые в один webp с прозрачностью;
         холста и скрипта под него больше нет вовсе;

       · рамы. Полотно со скруглением 24 обводило первый экран рамкой и
         читалось карточкой внутри страницы. Цвет остался тот же, а рама
         снята: экран идёт полосой во всю ширину и отделён от следующего
         блока одной линией.

       Вёрстка снизу вверх: сперва телефон, потом добавки для широких
       экранов. Порядок для этой страницы не формальность — с телефонов
       ждём девятнадцать посетителей из двадцати. -->
  <!-- Течение: полотно текучих линий во всю ширину, за текстом и за
       фигурой. Перенесено из варианта B, только заметнее. Рисует
       js/01-hero-flow.js; без скрипта остаётся ровный фон. -->
  <div class="s-hero__flow" aria-hidden="true">
    <canvas id="hero-flow"></canvas>
  </div>

  <div class="container s-hero__inner">

    <div class="s-hero__copy">

      <p class="eyebrow s-hero__eyebrow">
        <span class="eyebrow__dot"></span>
        All-in-one platform &middot; Free 14-day trial
      </p>

      <h1 class="h1 s-hero__title">Create and sell <em>digital products</em></h1>

      <!-- Подзаголовок разбит на куски: по ним по очереди проходит
           подсветка, см. js/01-hero-sub.js. Пробелы между span нужны —
           без них слова слипнутся. -->
      <p class="lead s-hero__lead" id="hero-sub">
        <span class="s-hero__seg">Love something?</span>
        <span class="s-hero__seg" data-static>We&rsquo;ll bring everything it takes to make it a business&nbsp;&ndash;</span>
        <span class="s-hero__seg" data-hold="1500">the store,</span>
        <span class="s-hero__seg" data-hold="1500">the products,</span>
        <span class="s-hero__seg" data-hold="1500">the marketing,</span>
        <span class="s-hero__seg" data-hold="1500">the people.</span>
      </p>

      <div class="s-hero__actions">
        <a class="btn btn--primary s-hero__cta" id="hero-cta" href="free-basic.html">
          Start for free
          <img class="s-hero__cta-icon" src="assets/img/icons/arrow-right-cream.svg" alt="" width="18" height="18">
        </a>
      </div>

      <p class="s-hero__terms">Free for 14 days, then <span data-sub>AED&nbsp;149</span>/month &middot; Cancel anytime</p>

    </div>

    <!-- Фигура вырезана по контуру и лежит прямо на фоне, без плашки и
         тени: край силуэта и есть её граница. -->
    <div class="s-hero__figure">
      <img class="s-hero__woman" src="assets/img/people/hero-woman.webp"
           alt="A Tajiro store owner with her phone"
           width="420" height="846" fetchpriority="high" decoding="async">
    </div>

  </div>
</section>

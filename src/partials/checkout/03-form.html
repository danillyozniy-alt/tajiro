<!-- ==========================================================================
     Оплата · данные, платёж и согласия

     Собрано по чекауту экомзи — тому самому, с которого списан и прототип.
     Оттуда же взяты ассеты: знак Google Pay, полоса платёжных систем,
     замок и печать SSL. Рисовать их заново незачем, а приблизительно
     нарисованный фирменный знак хуже отсутствия знака.

     Поля карты — ЗАГЛУШКА, и это видно: на месте настоящего поля стоит
     плашка с меткой STRIPE ELEMENTS. Так и в прототипе, и у экомзи — там
     на этом месте пустые контейнеры, которые заполняет сам Stripe.
     Рисовать поддельное поле карты нельзя ни при каких условиях: человек
     может принять его за настоящее и начать вводить номер.

     Подключение описано в заметке внизу pages/checkout.html.
     ========================================================================== -->
<form class="ch__form" id="ch-form" novalidate>

  <h2 class="ch__label">Your information</h2>

  <label class="fld" for="ch-email">
    <span class="fld__label">Email</span>
    <input class="fld__input" id="ch-email" name="email" type="email"
           placeholder="you@example.com" autocomplete="email"
           required spellcheck="false" autocapitalize="off" inputmode="email">
  </label>

  <div class="fld">
    <span class="fld__label" id="ch-phone-label">Phone (optional)</span>
    <div class="fld__row">
      <select class="fld__select" id="ch-dial" name="dial" aria-label="Dial code">
        <option>+971</option>
        <option>+966</option>
        <option>+974</option>
        <option>+973</option>
        <option>+968</option>
        <option>+965</option>
      </select>
      <input class="fld__input" id="ch-phone" name="phone" type="tel"
             placeholder="50 123 4567" autocomplete="tel"
             aria-labelledby="ch-phone-label">
    </div>
  </div>

  <h2 class="ch__label ch__label--pay">Your payment info</h2>

  <!-- Кнопка кошелька. У экомзи здесь пустой контейнер, в который Stripe
       сам вставляет родную кнопку Apple Pay или Google Pay и прячет блок
       целиком, если способ на устройстве недоступен. Здесь заглушка того
       же вида: чёрная кнопка с фирменным лок-апом.

       Она нарочно НЕ в стиле Tajiro. Кнопку способа оплаты узнают в лицо,
       и перекрашенная в кремово-зелёное она перестаёт читаться. -->
  <button class="ch__wallet" type="button" data-stub="wallet">
    <span class="ch__wallet-text">Proceed with</span>
    <span class="ch__gpay">
      <img class="ch__gpay-g" src="assets/img/checkout/gpay.svg" alt="" width="20" height="20">
      <span class="ch__gpay-word">Pay</span>
    </span>
  </button>

  <!-- Способы оплаты — набор и раскладка прототипа: подпись слева, знаки
       справа. Discover, Diners и JCB, которые были в полосе экомзи, сняты:
       в заливе ими не платят.

       Знаки настоящие, каждый от своего владельца:
         Visa, Mastercard, AMEX — Wikimedia Commons, файлы помечены как не
                  достигающие порога оригинальности (авторских прав нет,
                  торговые знаки остаются торговыми)
         mada   — оттуда же
         Tabby  — со страницы tabby.ai, их собственный знак в разметке

       У AMEX знак — синий квадрат, внутри которого «AMERICAN EXPRESS» в
       две строки. На двадцати пикселях эти слова нечитаемы, а отдельно от
       квадрата знака не существует. Поэтому взят короткий знак «AMEX» из
       полосы экомзи — тот, что рисуют как раз под мелкий размер. Вырезан
       не файлом, а фоном: полоса лежит целиком, а видно из неё одно окно
       (см. .ch__mark-crop).

       У Mastercard полотно обрезано по кругам: в исходном файле под ними
       стоит слово «mastercard», а на двадцати пикселях высоты оно
       превращается в грязь. Знак узнают по кругам, читать там нечего.

       Плашки, а не знаки в ряд: пропорции у знаков разные — Visa широкая,
       AMEX квадратный, — и без общей рамки ряд читается вразнобой. В
       прототипе на этом месте такие же плашки, только с подписями. -->
  <div class="ch__pays">
    <span class="ch__pays-label">Or pay with card</span>
    <span class="ch__marks">
      <span class="ch__mark"><img class="ch__mark-img ch__mark-img--word" src="assets/img/checkout/visa.svg" alt="Visa" width="40" height="13" loading="lazy" decoding="async"></span>
      <span class="ch__mark"><img class="ch__mark-img ch__mark-img--sign" src="assets/img/checkout/mastercard.svg" alt="Mastercard" width="32" height="20" loading="lazy" decoding="async"></span>
      <span class="ch__mark"><i class="ch__mark-crop" role="img" aria-label="American Express"></i></span>
      <span class="ch__mark"><img class="ch__mark-img ch__mark-img--word" src="assets/img/checkout/mada.svg" alt="mada" width="40" height="13" loading="lazy" decoding="async"></span>
      <span class="ch__mark ch__mark--tabby"><img class="ch__mark-img ch__mark-img--word" src="assets/img/checkout/tabby.svg" alt="Tabby" width="40" height="11" loading="lazy" decoding="async"></span>
    </span>
  </div>
  <div class="ch__stripe" aria-hidden="true">
    <p class="ch__fake">Card number</p>
    <p class="ch__fake">Name on card</p>
    <div class="ch__fake-row">
      <p class="ch__fake">MM / YY</p>
      <p class="ch__fake">CVC</p>
    </div>
  </div>

  <p class="ch__safe">
    <img class="ch__lock" src="assets/img/checkout/lock.svg" alt="" width="14" height="14">
    <span><b>Guaranteed</b> safe &amp; secure checkout</span>
  </p>

  <!-- Кнопка выключена, пока не отмечены оба согласия, а под ней стоит
       строка-подсказка, которая исчезает после отметки. Порядок как у
       экомзи: сначала кнопка, потом подсказка, потом сами флажки — она
       стоит ровно между тем, что не нажалось, и тем, что для этого нужно.
       Состоянием заведует js/checkout/consent.js. -->
  <button class="btn btn--primary btn--block ch__pay" type="submit" id="ch-submit" data-stub="submit" disabled>
    Complete order
  </button>

  <p class="ch__gate" id="ch-gate">*Please check the boxes below to start your trial.</p>

  <div class="ch__consents">
    <label class="chk" for="ch-terms">
      <input class="chk__box" id="ch-terms" type="checkbox" data-consent>
      <span class="chk__mark" aria-hidden="true"></span>
      <span>I agree to the <a href="#" data-stub="terms">Terms of Use</a> and <a href="#" data-stub="privacy">Privacy Policy</a>.</span>
    </label>

    <label class="chk" for="ch-renew">
      <input class="chk__box" id="ch-renew" type="checkbox" data-consent>
      <span class="chk__mark" aria-hidden="true"></span>
      <span>I agree to auto-renewal: 14-day free trial, then <span data-price>AED&nbsp;149<span class="ch__dec">.00</span></span>/month (VAT included) from <span data-date>the trial end date</span> until canceled. Cancel instantly via dashboard or contact support@tajiro.com.</span>
    </label>
  </div>

</form>

<footer class="ch__foot">
  <img class="ch__ssl" src="assets/img/checkout/ssl-badge.svg" alt="SSL secure access" width="173" height="38">
  <p class="ch__copy">&copy; 2026 Tajiro Technologies Corporation &middot; Cluster C, JLT, Al Thanyah 5, Dubai, UAE</p>
</footer>

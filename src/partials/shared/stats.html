<section class="section s-02" id="stats">
  <div class="container">
    <h2 class="visually-hidden">What comes with every Tajiro store</h2>

    <!-- column-reverse в стилях: в разметке сначала подпись (dt), потом
         значение (dd) — так требует список определений, а на экране число
         стоит сверху. -->
    <dl class="s-02__grid reveal-set">
      <div class="s-02__stat">
        <dt class="s-02__label">Products ready to import</dt>
        <dd class="s-02__value">10,000+</dd>
      </div>

      <div class="s-02__stat">
        <dt class="s-02__label">Creator economy by 2027<sup class="s-02__ref">1</sup></dt>
        <dd class="s-02__value">$480B</dd>
      </div>

      <div class="s-02__stat">
        <dt class="s-02__label">Platform commission on your store<sup class="s-02__ref">2</sup></dt>
        <dd class="s-02__value">0%</dd>
      </div>

      <div class="s-02__stat">
        <dt class="s-02__label">Digital, delivered instantly</dt>
        <dd class="s-02__value">100%</dd>
      </div>
    </dl>

    <!-- Сноски: две цифры выше опираются на внешнюю оценку и на оговорку
         про эквайринг. Без них «0 %» читается как «денег не берут вообще». -->
    <p class="s-02__note">
      <span class="s-02__note-item"><sup class="s-02__ref">1</sup> Total addressable market estimate, Goldman Sachs Research, 2023.</span>
      <span class="s-02__note-item"><sup class="s-02__ref">2</sup> Payment processing fees apply.</span>
    </p>
  </div>
</section>

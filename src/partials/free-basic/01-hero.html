<section class="fb-section fb-section--sand fb-decor fb-hero" id="hero">
  <div class="container fb-hero__wrap">

    <div class="fb-hero__text">
      <!-- Пилюля с живой точкой — общий компонент базы: та же, что на
           первом экране главной. В прототипе здесь была строчка с кружком. -->
      <p class="eyebrow fb-hero__eyebrow">
        <i class="eyebrow__dot" aria-hidden="true"></i>
        Free to start &middot; Ready in minutes
      </p>

      <!-- Перед тире ОБЫЧНЫЙ пробел, а не неразрывный. В прототипе стоял
           неразрывный: он приклеивал тире к предыдущему слову, и на узкой
           колонке «business —» переставало влезать в строку вместе с
           «online» — заголовок уходил в четыре строки вместо трёх. Тире
           теперь закрывает строку, а «for free» начинает следующую. -->
      <h1 class="h1 fb-hero__title">Launch your online business — <em class="fb-nowrap">for free</em></h1>

      <p class="lead fb-hero__lede">Get a ready-made store loaded with 100 products people actually buy. Create your own, too. We handle the marketing. You keep your margin.</p>

      <div class="fb-actions fb-hero__actions">
        <a class="btn btn--primary" href="checkout.html">Start your free store</a>
      </div>

      <p class="meta fb-terms">Free 14-day trial &middot; Nothing to ship &middot; No experience needed</p>
    </div>

    <!-- Снимок в рамке. Не силуэт: вырезанный контур показывает человека,
         а здесь нужно показать ДЕЛО — комнату, стол, посылки, ноутбук.
         Рамка эту сцену и держит: без неё кадр растёкся бы по песку
         секции, а скруглённая кромка делает из него предмет.

         ЧТО ЗДЕСЬ БЫЛО. Стеклянная панель аналитики: выручка за неделю,
         число продаж и три последние покупки. Снята по правке. Цифры
         оттуда никуда не делись — те же показатели стоят полосой ниже, в
         02, и там они подписаны, а не показаны скриншотом. -->
    <figure class="fb-hero__shot">
      <img src="assets/img/people/fb-hero-owner.webp"
           alt="A Tajiro store owner checking an order on his phone"
           width="896" height="1152" fetchpriority="high" decoding="async">
    </figure>


  </div>
</section>

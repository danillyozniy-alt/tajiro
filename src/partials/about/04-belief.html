<!-- ==========================================================================
     О нас — зачем мы это начали

     Состав как у образца (ecomzy.com/about): карточка, слева портрет
     основателя во всю высоту карточки, справа крупная кавычка, цитата,
     имя и должность. На телефоне и планшете портрет встаёт сверху во всю
     ширину, текст под ним.

     Цитата, имя и должность — из макета Tajiro_About.html: Ilia Dolgikh,
     CEO and Founder. Выделения жирным внутри цитаты у макета — это
     оформление, его не брали.

     Портрет — тот же снимок, что на странице «о нас» экомзи
     (pages/about/images/Ilya.webp): у исходника по краям зашиты скругления,
     поэтому он обрезан на 24 точки с каждой стороны, и углы карточки
     скругляет уже сама карточка.

     Курсива нет. У Almarai нет курсивного начертания, браузер подделал бы
     его наклоном, и на пяти строках подряд это видно. По своду стиля роль
     курсива в цитате берёт кегль (TAJIRO-STYLE.md, § 2).

     Карточка — div, а цитата с подписью — figure внутри неё: figcaption
     обязан быть прямым потомком figure, а портрет к подписи не относится.
     ========================================================================== -->
